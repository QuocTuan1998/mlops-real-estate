name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Only build/push on actual pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t real-estate-price-prediction:latest .

      - name: Smoke test container
        run: |
          docker run -d --name api-smoke-test -p 8000:8000 real-estate-price-prediction:latest
          echo "Waiting for API to start..."
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs api-smoke-test && exit 1)
          docker stop api-smoke-test
          docker rm api-smoke-test

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag and push Docker image
        run: |
          docker tag real-estate-price-prediction:latest ${{ secrets.DOCKER_USERNAME }}/real-estate-price-prediction:latest
          docker tag real-estate-price-prediction:latest ${{ secrets.DOCKER_USERNAME }}/real-estate-price-prediction:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/real-estate-price-prediction:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/real-estate-price-prediction:${{ github.sha }}
